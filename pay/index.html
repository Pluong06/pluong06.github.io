<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Checkout</title>
  <meta name="robots" content="noindex" />
  <style>
    :root { --bg: #f8fafc; --card: #fff; --text: #0f172a; --muted: #64748b; --ok: #059669; --err: #dc2626; --line: #e2e8f0; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --line: #334155; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%; max-width: 440px; padding: 32px 24px; text-align: center;
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0; color: var(--muted); }
    .spinner {
      width: 36px; height: 36px; margin: 0 auto 16px; border-radius: 50%;
      border: 4px solid var(--line); border-top-color: var(--muted); animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ok h1 { color: var(--ok); }
    .err h1 { color: var(--err); }
    .ok .spinner, .err .spinner { display: none; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main class="card" id="card">
    <div class="spinner"></div>
    <h1 id="title">Opening secure checkout…</h1>
    <p id="msg">Payments are processed by Paddle, our merchant of record.</p>
  </main>

  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <script>
    /*
     * Shared checkout page for every product on this Paddle account.
     * Set as Paddle → Checkout → Checkout settings → Default payment link.
     *
     *   ?_ptxn=txn_...                     Paddle's own links (renewals, card updates, invoices)
     *   ?price=pri_...&success=<url>       open checkout for a price, then go to <url>?key=txn_...
     */
    const CONFIG = {
      environment: "production",                    // "sandbox" for test cards
      clientToken: "live_3528247d6b3daf1a7c411fdedfa",
      supportEmail: "luongshinichi@gmail.com",
      // Only redirect after payment to your own sites.
      allowedRedirectHosts: ["pluong06.github.io"]
    };

    const params = new URLSearchParams(location.search);
    const card = document.getElementById("card");
    const setState = (cls, title, html) => {
      card.className = `card ${cls}`;
      document.getElementById("title").textContent = title;
      document.getElementById("msg").innerHTML = html;
    };

    function safeRedirect(raw) {
      try {
        const url = new URL(raw);
        return url.protocol === "https:" && CONFIG.allowedRedirectHosts.includes(url.hostname) ? url : null;
      } catch (_) {
        return null;
      }
    }

    const successUrl = safeRedirect(params.get("success") || "");
    const priceId = params.get("price") || "";
    const hasTxn = params.has("_ptxn");

    if (CONFIG.environment === "sandbox") Paddle.Environment.set("sandbox");
    Paddle.Initialize({
      token: CONFIG.clientToken,
      eventCallback: e => {
        if (e.name === "checkout.completed") {
          const txn = e.data && e.data.transaction_id;
          if (successUrl && txn) {
            successUrl.searchParams.set("key", txn);
            setTimeout(() => (location.href = successUrl.href), 1500);
          } else {
            setState("ok", "Payment complete — thank you!", "A receipt has been sent to your email. You can close this page.");
          }
        }
        if (e.name === "checkout.closed" && !card.classList.contains("ok")) {
          setState("", "Checkout closed", "No payment was made. Go back to the product page to try again.");
        }
      }
    });

    if (/^pri_[a-z0-9]+$/i.test(priceId)) {
      Paddle.Checkout.open({ items: [{ priceId, quantity: 1 }], settings: { displayMode: "overlay" } });
    } else if (!hasTxn) {
      setState("err", "Nothing to pay here", `Open checkout from a product page, or email <a href="mailto:${CONFIG.supportEmail}">${CONFIG.supportEmail}</a> for help.`);
    }
    // With ?_ptxn=..., Paddle.Initialize opens that checkout automatically.
  </script>
</body>
</html>
